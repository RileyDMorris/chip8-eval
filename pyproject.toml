[project]
name = "chip8-eval"
version = "0.1.0"
description = "A benchmark that measures how well AI coding agents build a CHIP-8 emulator from a written spec."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8", "anthropic>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "docker: needs a running Docker daemon",
    "slow: takes more than a few seconds",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reference*", "romgen*", "grader*", "harness*", "report*"]
